<svg xmlns="http://www.w3.org/2000/svg" width="90" height="90" viewBox="0 0 90 90">
  <defs>
    <style>
      .gold-stroke { stroke: #b8955c; fill: none; stroke-linecap: round; stroke-linejoin: round; }
      .gold-fill { fill: #b8955c; }
    </style>
  </defs>

  <!-- Central Diamond Lotus Motif -->
  <g opacity="0.14">
    <!-- Diamond curvature -->
    <path class="gold-stroke" stroke-width="0.8" d="M45,6 C52,24 66,38 84,45 C66,52 52,66 45,84 C38,66 24,52 6,45 C24,38 38,24 45,6 Z"/>
    
    <!-- Inner Petals -->
    <circle class="gold-stroke" stroke-width="0.6" cx="45" cy="45" r="14"/>
    <circle class="gold-stroke" stroke-width="0.5" cx="45" cy="45" r="6"/>
    <circle class="gold-fill" cx="45" cy="45" r="2"/>

    <!-- Small petal accents -->
    <path class="gold-stroke" stroke-width="0.5" d="M45,31 C47,38 43,38 45,31 Z M45,59 C47,52 43,52 45,59 Z M31,45 C38,47 38,43 31,45 Z M59,45 C52,47 52,43 59,45 Z"/>
  </g>

  <!-- Corner Flourishes connecting across tiles -->
  <g opacity="0.10">
    <!-- Top-left -->
    <circle class="gold-stroke" stroke-width="0.6" cx="0" cy="0" r="10"/>
    <circle class="gold-fill" cx="0" cy="0" r="2"/>
    <path class="gold-stroke" stroke-width="0.6" d="M0,18 C7,14 14,7 18,0"/>

    <!-- Top-right -->
    <circle class="gold-stroke" stroke-width="0.6" cx="90" cy="0" r="10"/>
    <circle class="gold-fill" cx="90" cy="0" r="2"/>
    <path class="gold-stroke" stroke-width="0.6" d="M90,18 C83,14 76,7 72,0"/>

    <!-- Bottom-left -->
    <circle class="gold-stroke" stroke-width="0.6" cx="0" cy="90" r="10"/>
    <circle class="gold-fill" cx="0" cy="90" r="2"/>
    <path class="gold-stroke" stroke-width="0.6" d="M0,72 C7,76 14,83 18,90"/>

    <!-- Bottom-right -->
    <circle class="gold-stroke" stroke-width="0.6" cx="90" cy="90" r="10"/>
    <circle class="gold-fill" cx="90" cy="90" r="2"/>
    <path class="gold-stroke" stroke-width="0.6" d="M90,72 C83,76 76,83 72,90"/>
  </g>
</svg>
